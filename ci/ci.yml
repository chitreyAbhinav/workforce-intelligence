name: WorkforceX Intelligence CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-validate:
    name: Code Hygiene & Data Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pandas openpyxl scikit-learn selenium

      - name: Lint Code with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src/ app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src/ app/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  test-suites:
    name: Pytest Unit, Integration & AI-Assisted Testing
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Data Quality Engine
        run: python src/data_quality_engine.py

      - name: Run Pytest Unit & Integration Tests
        run: pytest tests/test_data_quality.py tests/test_ml_models.py tests/test_engines.py tests/test_api.py -v --tb=short

      - name: Run AI-Assisted Metamorphic Invariant Tests
        run: pytest tests/test_ai_assisted.py -v --tb=short

  selenium-e2e:
    name: Headless Browser Selenium E2E Automation
    needs: test-suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Google Chrome Headless
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Selenium E2E Browser Automation
        run: pytest tests/test_selenium_e2e.py -v

  build-artifacts:
    name: Generate Final Presentation & Approach Note
    needs: selenium-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Documentation Tools
        run: pip install python-docx python-pptx

      - name: Build Submission Artifacts
        run: python run_all.py --generate-reports

      - name: Archive Final Reports Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Round2-Submission-Package
          path: reports/
